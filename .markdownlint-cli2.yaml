# ==============================================================================
# markdownlint-cli2 — the markdown linter, run by .pre-commit-config.yaml
# ==============================================================================
# Two tools share the markdown in this repo and they do NOT overlap:
#
#   prettier           formatting — wrapping, table padding, emphasis markers
#   markdownlint-cli2  everything else — missing code-fence languages,
#                      over-long prose, indented code blocks
#
# Only the second one is a hook. Prettier is whatever an editor runs on save,
# so it wins every race regardless of what this repo says, and the rules below
# are tuned so that its output passes untouched. Each rule that turned out to
# be a genuine disagreement is switched off here and says why, rather than
# being left to churn a diff on every save. (Prettier is also not in the ci
# shell on purpose — nixpkgs-26.05 has 3.8.3, which corrupts intraword
# underscores; see .pre-commit-config.yaml.)
#
#   nix develop .#ci -c markdownlint-cli2            # check
#   nix develop .#ci -c markdownlint-cli2 --fix      # fix what is mechanical
#
# `--fix` is for a one-off cleanup, not a habit: it normalises tables to
# markdownlint's own "compact" style, which an editor's prettier re-pads on the
# next save. Both styles pass this config, so the churn never fails anything —
# it just shows up in a diff nobody meant to make.

globs: ["**/*.md"]

ignores:
  # Generated by the superpowers agent workflow and kept as a historical
  # record, not as maintained prose: plan docs are thousands of lines of
  # machine-written text with 500-character goal statements. Linting them
  # would tax every future plan for no reader's benefit. They are still
  # prettier-formatted, because that is what an editor does on save.
  - "docs/superpowers/**"
  # Untracked scratch. Never reaches pre-commit, but `markdownlint-cli2` run
  # by hand globs the working tree and would find them.
  - ".remember/**"
  - ".superpowers/**"
  - "tofu/.terraform/**"
  - "result/**"

config:
  # MD004 (ul-style) — prettier DELIBERATELY alternates `-` and `*` between two
  # lists separated only by a paragraph, so that they parse as two lists rather
  # than merging into one. That is correct markdown and unfixable here: any
  # setting other than `false` fails on prettier's own output.
  MD004: false

  # A tab inside a fenced block is content, not indentation — the Caddyfile
  # snippets in the docs are tab-indented because Caddy's own formatter writes
  # them that way, and retyping them with spaces would make them wrong to paste.
  MD010:
    code_blocks: false

  # 80 columns, matching the prose in every .nix comment in this repo. Prettier
  # does not reflow prose (`proseWrap: preserve` is its default), so this is the
  # only thing that keeps a paragraph from arriving as one 500-column line.
  #
  # Tables and code blocks are exempt because neither can be wrapped without
  # changing what it means: 118 of the 199 original violations were table rows.
  MD013:
    line_length: 80
    tables: false
    code_blocks: false

  # Fenced, always. Without this the rule infers the style from whichever kind
  # of block appears FIRST in a file, so one indented block at the top makes
  # every fence below it an error.
  MD046:
    style: fenced
