# ==============================================================================
# Option packs — every world's modpack with packs/options laid over it
# ==============================================================================
# The -with-options builds (packs/default.nix): each world's pack plus the
# options in packs/options, so a fresh import starts with those settings. On
# a shared pack they are YOSBR defaults, so a player's own changes survive
# every update; see docs/src/minecraft/packs.md.
#
# This is the half a fork needs. Change packs/options, push, and the run's
# `option-packs` artifact holds the selected .mrpacks — no pages setup, no VPS.
#
# It does NOT publish. pages-pull serves only the newest artifact named
# `pages`, and replaces the repo's whole site with it, so a second workflow
# uploading `pages` would wipe the handbook. pages.yml stages these same
# builds into the site; both read the flake's mcN-mrpack-with-options, so the
# two cannot disagree.
name: Option packs

# Keep boot coverage on pull requests as well as main pushes.
on:
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - 'options/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/mrpack-*.py'
      - '.forgejo/workflows/option-packs.yml'
      - '.github/workflows/option-packs.yml'
  pull_request:
    paths:
      - 'packs/**'
      - 'options/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/mrpack-*.py'
      - '.forgejo/workflows/option-packs.yml'
      - '.github/workflows/option-packs.yml'
  workflow_dispatch:

concurrency:
  group: option-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  option-packs:
    name: Build and boot the packs with options
    # `nix`, as in pages.yml: the flake builds the packs, and node for the
    # upload comes from its dev shell.
    runs-on: nix

    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      # pages.yml's hand-written checkout: nixos/nix has no node for
      # actions/checkout.
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --prune origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/pull/*:refs/pull/*"
          git checkout -q --detach "$GITHUB_SHA"

      - name: Select affected worlds
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            set -- --pull-request
          else
            set --
          fi
          worlds=$(nix develop .#ci -c python3 -I packs/changed_worlds.py "$BASE_SHA" "$HEAD_SHA" "$@")
          printf 'worlds=%s\n' "$worlds" >> "$GITHUB_OUTPUT"
          printf 'Selected worlds: %s\n' "${worlds:-none}"

      # The name is the build's own, minus the store hash:
      # <fileName>-<minecraft>-with-options.mrpack
      - name: Build
        if: steps.select.outputs.worlds != ''
        env:
          WORLDS: ${{ steps.select.outputs.worlds }}
        run: |
          mkdir -p _packs _pack-builds
          for pack in $WORLDS; do
            out=$(nix build --print-out-paths --out-link "_pack-builds/$pack" ".#$pack-mrpack-with-options")
            nix build --out-link "_pack-builds/$pack-server-mods" ".#$pack-mrpack-with-options.serverMods"
            cp "$out" "_packs/$(basename "$out" | cut -d- -f2-)"
          done
          ls -l _packs

      # Consume the outputs above; do not build a second set of plain packs.
      - name: Boot the built options packs
        if: steps.select.outputs.worlds != ''
        env:
          WORLDS: ${{ steps.select.outputs.worlds }}
        run: nix develop .#ci -c packs/startup.sh _pack-builds $WORLDS

      # Verbatim from pages.yml: upload-artifact is a JavaScript action.
      - name: Put the dev shell's node on PATH for the upload action
        if: steps.select.outputs.worlds != ''
        run: |
          node_bin=$(nix develop .#ci -c bash -c 'command -v node')
          if [ -z "$node_bin" ]; then
            echo "no node in the dev shell — upload-artifact cannot run" >&2
            exit 1
          fi
          dirname "$node_bin" >> "$GITHUB_PATH"

      # forgejo/upload-artifact, not actions/: see pages.yml.
      - name: Upload
        if: steps.select.outputs.worlds != ''
        uses: forgejo/upload-artifact@v5
        with:
          name: option-packs
          path: _packs/
          if-no-files-found: error
