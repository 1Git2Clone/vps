# ==============================================================================
# CI — Forgejo
# ==============================================================================
# The existence of THIS DIRECTORY is what stops Forgejo running
# .github/workflows/ci.yml. Forgejo looks for .forgejo/workflows first and only
# falls back to .github/workflows when it is absent — a fallback, not a union.
# Before this file existed, the GitHub workflow ran on both forges, and on this
# one it failed: see the `runs-on` note below.
#
# So the two files are not duplicates to keep in sync for tidiness. They are one
# per forge, and deleting this one silently hands Forgejo the GitHub file again.
#
# git.hu-tao.dev is the source of truth and GitHub is a push-only mirror, so
# this is the run that actually gates the repo; the mirror's run is the
# redundant one. Both exist because the mirror should stand on its own.
#
# COST. Every job here runs on the VPS that also serves mail, git and the
# minecraft server. The runner's `cache:` is disabled and its `valid_volumes`
# allow-list has no entry for a nix store, so nothing is reused between runs:
# each one rebuilds the `.#ci` shell from the binary cache. Nix itself is no
# longer part of that bill — it is in the image — but the shell still is, which
# is the reason for a single job rather than the two the GitHub file uses: two
# jobs would pay that cost twice, in parallel, on `capacity: 2`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and evaluate
    # Declared in modules/containers/forgejo-runner.nix as
    # `nix:docker://nixos/nix:2.35.2`, and NOT ubuntu-latest. That label is
    # node:22-bookworm, which has no `sudo` — and cachix/install-nix-action
    # shells out to sudo unconditionally when it takes its non-systemd branch
    # (install-nix.sh lines 91-93), so every run died at exit 127 before a
    # single check ran. An image that already contains Nix removes the action,
    # the sudo, and a ~50MB download per run all at once.
    #
    # The trade: nixos/nix carries nix, bash, gitMinimal, curl and coreutils and
    # nothing else. No node — so no step below can be a `uses:`. Every
    # JavaScript action, actions/checkout included, is executed by a node binary
    # inside the JOB container, and there is none here.
    runs-on: nix

    # The image ships no experimental features, so set them once for the job
    # rather than repeating --extra-experimental-features on six commands.
    # NIX_CONFIG is merged with the image's /etc/nix/nix.conf rather than
    # replacing it, which matters: that file carries `sandbox = false`, and the
    # runner gives jobs `privileged: false`, so an unprivileged container that
    # tried to open a user namespace for a build sandbox would fail.
    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      # actions/checkout's replacement — see the `runs-on` note for why it
      # cannot be the action. Not a downgrade: the action's whole job here was a
      # full clone (it was configured `fetch-depth: 0`), because gitleaks scans
      # commits and a shallow clone would scan almost nothing.
      #
      # refs/pull/* is fetched alongside the branches so that one command serves
      # all three triggers — on a pull_request $GITHUB_SHA is the merge commit,
      # which no branch reaches. Anonymous: the repo is public, and the instance
      # has registration disabled, so there is no fork whose PR would need a
      # token.
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --prune origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/pull/*:refs/pull/*"
          git checkout -q --detach "$GITHUB_SHA"

      # The same file the local commit hook uses, so a green CI means a clean
      # `pre-commit run --all-files` on the developer's machine and vice versa.
      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # The pre-commit hook scans the STAGED diff, which is empty in CI, so the
      # history scan lives here instead. The full fetch above is what makes it a
      # real scan rather than a scan of one commit.
      - name: gitleaks (full history)
        run: nix develop .#ci -c gitleaks git --redact --no-banner .

      # Evaluation only — deliberately not a build. This catches the failure
      # that actually happens in this repo (a module that does not evaluate:
      # a typo'd option, a missing argument, an infinite recursion) without
      # asking this box to realise a multi-gigabyte system closure.
      - name: Evaluate vps-hetzner
        run: |
          nix eval --raw \
            .#nixosConfigurations.vps-hetzner.config.system.build.toplevel.drvPath

      - name: Evaluate vps (local VM variant)
        run: |
          nix eval --raw \
            .#nixosConfigurations.vps.config.system.build.toplevel.drvPath

      # --no-build, and the reason matters: deploy-rs contributes a
      # `deploy-activate` check that references the whole system closure, so a
      # plain `nix flake check` builds the entire NixOS system — and because
      # deploy-rs `follows` our nixpkgs, its binary is a cache miss and gets
      # compiled from source.
      - name: nix flake check (evaluate)
        run: nix flake check --no-build --print-build-logs

      # Validates deploy.json against deploy-rs's schema — the config only
      # otherwise exercised by running a real deploy.
      #
      # This line is unchanged, but what it costs is not. Until 2026-09-12 the
      # comment here claimed it pulled in "check-jsonschema alone, no Rust
      # toolchain and no system closure", and that was simply false: deploy.json
      # carries the activation path as a context-bearing string, so building it
      # built the system closure and compiled deploy-rs from source. It ran for
      # 4m43s on this runner. flake.nix now strips that context before the
      # validator sees the file — see the comment on `checks` there — which took
      # the derivation graph from 5367 paths to 1890 and the step to seconds.
      #
      # The second check is the guard that the first one is real: it feeds the
      # same validator a node with no `hostname` and fails if that is accepted.
      # Without it a validator that silently read nothing would pass forever.
      - name: Validate the deploy schema
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.deploy-schema \
            .#checks.x86_64-linux.deploy-schema-rejects-bad-input

      # NOT runner-firewall — that one is a two-node NixOS VM test and needs
      # /dev/kvm, which this box does not have (shared-vCPU Hetzner instance,
      # no nested virtualisation; a VM test here would fall back to qemu's TCG
      # software emulation, measured at ~5x slower just to boot two minimal
      # nodes). runner-firewall stays hand-run: `nix build
      # .#checks.x86_64-linux.runner-firewall -L` on a machine with KVM.
      #
      # This is the automated stand-in: it greps the EVALUATED nftables
      # ruleset for line order rather than booting anything, so it needs no
      # KVM and costs seconds. It catches the exact regression runner-firewall
      # exists for — the VPS rules sinking below a broad `podman*` accept —
      # just not with a real packet, which is why the VM test still exists for
      # a human to run before trusting a change to firewall.nix.
      - name: Validate the runner firewall rule order
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.runner-firewall-ordering

      # Same gap class as the ordering check above, and worth naming: a check
      # that is only EVALUATED never runs its builder, so its failure branch is
      # inert. `nix flake check --no-build` would not notice the runner growing
      # a sops-install-secrets unit — that host holds no age key, so a
      # copy-pasted module import bringing secrets management onto it is a real
      # regression this only catches when something actually builds it.
      - name: Check the runner host holds no secrets
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.runner-has-no-secrets
