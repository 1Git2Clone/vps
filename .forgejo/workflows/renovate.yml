# ==============================================================================
# Renovate — Forgejo
# ==============================================================================
# Forgejo only, with no twin under .github/workflows. git.hu-tao.dev is the
# source of truth and GitHub is a push-only mirror, so the PRs have to open
# here; a second copy on the mirror would open a second set of PRs against a
# repo whose commits are overwritten by the next mirror push.
#
# `schedule` runs only from the DEFAULT BRANCH — Forgejo registers the cron
# from main and ignores this file on branches and pull requests. So a change to
# the cron takes effect when it merges, not when it is pushed, and
# workflow_dispatch is the only way to try a change before then.
#
# THE TOKEN IS NOT IN SOPS. sops-nix decrypts onto the host; this runs in a job
# container, which cannot read the host's filesystem. `secrets.RENOVATE_TOKEN`
# is a Forgejo Actions secret, set once at
# git.hu-tao.dev/hutao/vps/settings/actions/secrets.
#
# A repo secret on hutao/vps is enough even though the run touches every repo
# under hutao and skavex: the secret is read where the WORKFLOW lives, not where
# the PR lands.
#
# ── The account it belongs to ─────────────────────────────────────────────────
# A `renovate` bot account, NOT a personal token. Renovate takes its git author
# from whichever account the token belongs to, so a personal token makes every
# update commit indistinguishable from a hand-written one — in `git log`, in
# blame, and in the PR list.
#
# It is created by hand, in the UI, exactly like the runner record in
# modules/containers/forgejo-runner.nix. Forgejo has no config-file user
# provisioning, so the only declarative-looking alternative is a oneshot running
# `forgejo admin user create` through docker exec, and that is worse in three
# ways at once: the command is not idempotent, so every rebuild needs a guard;
# `--access-token` PRINTS the token, which on a `log-driver = journald`
# container means writing a live credential into the journal; and it still
# cannot do the two steps that actually matter — storing the token as an Actions
# secret and granting the account access to skavex — because both are API calls,
# not CLI ones. It would automate one step of four and leak a secret doing it.
#
# Registration is disabled on the instance (see forgejo.nix), so this is an
# admin action:
#
#   1. Site Administration -> Identity & Access -> Accounts -> Create User
#      Account. Username `renovate`, any mailbox that is not a real person's.
#   2. As `renovate`: /user/settings/applications -> Generate New Token, with
#      write on `repository` and `issue`, read on `user` and `organization`.
#      Issue because the dependency dashboard IS an issue and the run silently
#      produces no dashboard without it; organization because skavex is one and
#      its repos are invisible without it.
#   3. Paste it as RENOVATE_TOKEN, at the settings URL above.
#   4. Grant the account write: collaborator on hutao/vps, and a skavex team
#      with write on the repos it should touch. Autodiscover lists what the
#      TOKEN can see, so this step is what actually scopes the bot — the
#      namespace filter below only narrows it further.
#
# COST. Same bill as ci.yml: no nix store is reused between runs, so this pays
# for Renovate's closure from the binary cache once a week on the box that also
# serves mail, git and the minecraft server. Weekly rather than daily for that
# reason alone — nothing here needs same-day updates.
name: Renovate

on:
  schedule:
    # UTC, by leaving `timezone:` off — Forgejo defaults to it. A civil zone
    # here would move the run by an hour twice a year, and Forgejo's DST
    # handling is not GitHub's: it SKIPS a run when the clock jumps forward and
    # runs it TWICE when it falls back. Nothing about a dependency check wants
    # either, and noon UTC is nowhere near a transition anyway.
    # Daily, not weekly — affordable only because dependencyDashboardApproval
    # in renovate.json5 means a run opens no pull requests. It refreshes one
    # issue, so the cost is a Renovate closure download and about a minute of
    # runner time, and the dashboard is never more than a day stale.
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Open update pull requests
    # The Nix image, for two reasons rather than one. The obvious one is the
    # same as ci.yml's: no node in this image, so no `uses:` — and Renovate
    # comes from the flake instead of an action. The one that decides it is
    # lockFileMaintenance: Renovate does not edit flake.lock itself, it shells
    # out to `nix flake update`, so the `nix` binary must be on PATH INSIDE the
    # job container. ghcr.io/renovatebot/renovate has no nix; this does.
    runs-on: nix

    env:
      # Set at the job level so the `nix` that Renovate shells out to inherits
      # it too — a subprocess with no flakes support fails lock maintenance
      # alone, leaving the container updates working and nixpkgs frozen.
      NIX_CONFIG: experimental-features = nix-command flakes

      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://git.hu-tao.dev/api/v1/
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}

      # FILTER, not NAMESPACES. autodiscoverNamespaces sounds like the right
      # key and is not: on Forgejo it resolves each name through orgListRepos,
      # i.e. GET /api/v1/orgs/<name>/repos, which only knows organizations.
      # `skavex` is one and `hutao` is a user, so the first run died on
      #
      #   404 GET https://git.hu-tao.dev/api/v1/orgs/hutao/repos
      #   "errors": ["user redirect does not exist [name: hutao]"]
      #
      # and took the whole run with it — the lookup happens before any repo is
      # processed, so skavex was never reached either.
      #
      # autodiscoverFilter is applied client-side to the list Forgejo already
      # returned, so it does not care whether a namespace is a user or an org.
      # The list itself is "every repo this token can see", which is already
      # exactly ours: the bot is a collaborator on hutao/vps and a member of
      # one skavex team. The filter is therefore not what scopes the bot today
      # — team membership is — it is what stops a future grant from silently
      # enrolling a repo nobody meant to hand over.
      RENOVATE_AUTODISCOVER: "true"
      RENOVATE_AUTODISCOVER_FILTER: hutao/*,skavex/*

      # No RENOVATE_GIT_AUTHOR. On Forgejo, Renovate reads the name and commit
      # email of whatever account the token belongs to and uses that — and it
      # is not cosmetic. Renovate decides "did a human edit my branch?" by
      # comparing each commit's author to gitAuthor, so an override that does
      # not match the token's account makes Renovate read its OWN commits as
      # someone else's and stop updating the branch. Letting it detect the
      # value cannot disagree with the account.

      # NOT the Forgejo token, and not optional in practice. Renovate reads
      # github.com for two different things: release notes for PR bodies, and
      # the actual versions of anything sourced there. The first run warned
      #
      #   WARN: GitHub token is required for some dependencies
      #   githubDeps: ["actions/checkout", "cachix/install-nix-action",
      #                "hashicorp/terraform"]
      #
      # Anonymous github.com allows 60 requests per hour per IP, so without this
      # those three are rate-limited into silence — they do not error, they just
      # stop producing updates, which is the failure mode you never notice.
      #
      # A classic PAT with NO scopes ticked is correct and sufficient: it only
      # needs to raise the read limit on public data. Set it at
      # git.hu-tao.dev/hutao/vps/settings/actions/secrets alongside
      # RENOVATE_TOKEN. Until it exists this resolves to empty, which is exactly
      # the behaviour of not setting it at all — so this line is safe to merge
      # before the secret is created.
      GITHUB_COM_TOKEN: ${{ secrets.GITHUB_COM_TOKEN }}

      # Renovate's default is to install its own copies of the tools a manager
      # needs, which here would mean fetching a second Nix into a container that
      # already has one. `global` means "use what is on PATH".
      RENOVATE_BINARY_SOURCE: global

    steps:
      # Renovate clones the repo itself, from the endpoint above — this checkout
      # is not for Renovate. It is for `nix develop .#renovate`, which needs
      # flake.nix and flake.lock on disk to resolve to the pinned version.
      #
      # So, unlike ci.yml's checkout, shallow is fine: nothing here reads
      # history.
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      # A shell of its own rather than an entry in `.#ci`. Renovate's closure is
      # a node runtime and change: ci.yml runs on every push and every PR, and
      # putting Renovate in the shell it enters would make every one of those
      # runs download it for a job that never invokes it.
      - name: Renovate
        run: nix develop .#renovate -c renovate
