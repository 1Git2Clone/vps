# ==============================================================================
# Pages — build the handbook and hand it to the VPS
# ==============================================================================
# This job does NOT publish anything. It uploads an artifact named `pages`, and
# modules/pages-pull.nix on the VPS fetches it every five minutes and unpacks
# it into the pages volume. The direction is deliberate: a runner on its own
# box must never reach into the VPS, which is the entire premise of the split.
# See docs/src/operations/pages.md.
#
# The published URL is https://pages.hu-tao.dev/hutao/vps/docs/ — the layout of
# the artifact IS the URL below `<owner>/<repo>/`, with no rewriting anywhere,
# which is why the book is staged under `_site/docs/` rather than at the root.
#
# NOT on `main` only. The book builds on every pull request too, because
# `create-missing = false` in docs/book.toml turns a dead cross-reference into
# a build failure — and a build failure is worth catching in review rather than
# after it is serving a 404. Only a push to main uploads.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/book.toml"
      - "docs/src/**"
      - "flake.nix"
      - "flake.lock"
      - ".forgejo/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/book.toml"
      - "docs/src/**"
      - "flake.nix"
      - "flake.lock"
      - ".forgejo/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build the handbook
    # `nix`, not `ubuntu-latest`, for the same reason ci.yml uses it: that
    # label is node:22-bookworm, and mdbook would then be a download per run
    # instead of a devShell the binary cache already has. See ci.yml's own
    # note for the full reasoning.
    runs-on: nix

    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      # Byte-for-byte the checkout ci.yml uses, and for the same reason: the
      # nixos/nix image carries no node, so actions/checkout cannot run here.
      #
      # Deliberately NOT `--depth 1 origin $GITHUB_SHA`, which would be the
      # obvious saving — fetching a bare SHA needs the server to allow
      # want-sha (uploadpack.allowAnySHA1InWant), which is not something this
      # workflow should depend on. refs/pull/* is fetched alongside the
      # branches so one command serves all three triggers: on a pull_request
      # $GITHUB_SHA is the merge commit, which no branch reaches.
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --prune origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/pull/*:refs/pull/*"
          git checkout -q --detach "$GITHUB_SHA"

      # `mdbook-mermaid install` writes mermaid.min.js and mermaid-init.js
      # next to book.toml, which docs/book.toml's `additional-js` then
      # references. They are gitignored: 2.6 MB of vendored minified JS whose
      # version is already pinned by flake.lock, so committing it would put
      # the same bytes in history again on every bump. The consequence is that
      # this step is NOT optional — without it `mdbook build` fails on the
      # missing files rather than quietly shipping un-rendered fences.
      - name: Build
        run: |
          nix develop .#ci -c mdbook-mermaid install docs
          nix develop .#ci -c mdbook build docs

      - name: Stage
        run: |
          mkdir -p _site/docs
          cp -r docs/book/. _site/docs/

      # forgejo/upload-artifact, NOT actions/upload-artifact. GitHub's v4
      # bundles @actions/artifact v2, which tests GITHUB_SERVER_URL's hostname,
      # decides a Forgejo instance is GitHub Enterprise Server, and THROWS
      # before opening a socket — so it fails with zero HTTP requests, which is
      # invisible in the server's access log and unfixable at any layer below
      # the action. The Forgejo fork's single patch is to make that check
      # return false.
      #
      # Bare `forgejo/upload-artifact@v5` is correct: DEFAULT_ACTIONS_URL is
      # unset on this instance, so Forgejo's default of https://code.forgejo.org
      # applies, and that is where the fork lives.
      #
      # The name `pages` is not cosmetic either — pages-pull.nix looks for an
      # artifact with exactly this name and ignores every other one.
      # THE UPLOAD STEP IS A JAVASCRIPT ACTION AND THIS IMAGE HAS NO NODE.
      # `nix` is nixos/nix, which ships nix, bash, gitMinimal, curl and
      # coreutils and nothing else — modules/runner/identity.nix says so in as
      # many words. The runner executes a JS action by invoking `node` inside
      # the job container, so without this the step dies before it runs:
      #
      #   crun: executable file `node` not found in $PATH
      #   [runner]: exitcode '127': command not found
      #
      # Installing into /root/.nix-profile rather than relying on $GITHUB_PATH,
      # because that directory is the FIRST entry of the image's own PATH
      # (verified against the registry's image config for nixos/nix:2.35.2), so
      # the binary is found by the container itself and not by anything the
      # runner has to agree to carry forward. The $GITHUB_PATH line is a second
      # belt for the case where the runner rebuilds PATH from scratch.
      #
      # `--inputs-from .` is what keeps this pinned: a bare `nixpkgs#nodejs_22`
      # resolves through the global registry to whatever channel the image
      # happens to have, which is a second, unlocked nixpkgs. This one comes
      # from our flake.lock like everything else.
      #
      # The action declares `using: node20`; node 22 runs it, and 22 is what
      # the runner's own `node-22` label means on this instance.
      - name: Provide node for the upload action
        run: |
          nix profile install --profile /root/.nix-profile \
            --inputs-from . nixpkgs#nodejs_22
          echo "/root/.nix-profile/bin" >> "$GITHUB_PATH"
          node --version

      # The staging path is the contract with modules/pages-pull.nix: whatever
      # is in the artifact is unpacked verbatim under <owner>/<repo>, so this
      # directory name is the `/docs/` in the published URL. Changing it
      # changes the URL and nothing warns you.
      # The artifact NAME is the publish switch, not an `if:` on the step.
      #
      # It used to be `if: push && main`, and that is exactly how the missing
      # node above reached main unnoticed: the step was SKIPPED on the pull
      # request, so the branch went green having never once executed the thing
      # that was broken. A gate that turns the risky step off for every rehearsal
      # is not a gate, it is a blindfold.
      #
      # Now the upload always runs and the name decides what happens to it.
      # modules/pages-pull.nix looks for an artifact called exactly `pages` and
      # ignores every other one, so a pull request uploading `pages-preview`
      # exercises the whole path — node, the action, the twirp service, caddy's
      # allow-list — and publishes nothing.
      #
      # Computed into $GITHUB_ENV by a plain shell `if` rather than with an
      # inline `${{ a && b || c }}` ternary: this file's job is to be obvious,
      # and the ternary's operand-returning semantics are a GitHub-ism worth not
      # betting a silent publish on.
      - name: Decide the artifact name
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "ARTIFACT_NAME=pages" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_NAME=pages-preview" >> "$GITHUB_ENV"
          fi

      - name: Upload
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: _site
          retention-days: 7
