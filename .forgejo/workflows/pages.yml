# ==============================================================================
# Pages — build the handbook and hand it to the VPS
# ==============================================================================
# This job does NOT publish anything. It uploads an artifact named `pages`, and
# modules/pages-pull.nix on the VPS discovers it and unpacks it into the pages
# volume. The direction is deliberate: a runner on its own box must never reach
# into the VPS, which is the entire premise of the split.
# See docs/src/operations/pages.md.
#
# The published URL is https://pages.hu-tao.dev/hutao/vps/docs/ — the layout of
# the artifact IS the URL below `<owner>/<repo>/`, with no rewriting anywhere,
# which is why the book is staged under `_site/docs/` rather than at the root.
#
# THIS FILE IS SKAVEX'S pages.yml, ADAPTED. That repo and hutao/compress have
# both been publishing through this exact path since the runner moved off the
# VPS. An earlier version of this file invented its own answers to the same
# three problems — how to get node, when to upload, what to do about an empty
# build — and got each one slightly wrong. Where they disagree, the one that
# has been in production wins.
name: Pages

# main ONLY, plus a manual trigger. Deliberately NOT `pull_request`.
#
# An earlier version built on pull requests and put `if: push && main` on the
# upload step instead, so that a PR would typecheck the book without
# publishing. What that actually bought was a workflow whose riskiest step was
# skipped in every rehearsal: the branch introducing this file went green
# having never once run the upload, and the failure landed on main at merge.
#
# Gate the workflow, not the step. If the handbook should be checked on a pull
# request, that belongs in ci.yml, which already runs there and already pays
# for the dev shell.
#
# No `paths:` filter either, for the same family of reason. A filter is another
# thing that can silently be wrong — the obvious list misses docs/diagrams.css,
# and the symptom is a published site that quietly stops matching the repo. The
# build is 40 seconds.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: Build the handbook
    # `nix`, not `ubuntu-latest`, for the same reason ci.yml uses it: that
    # label is node:22-bookworm, and mdbook would then be a download per run
    # rather than a dev shell the binary cache already has.
    runs-on: nix

    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      # The same hand-written checkout ci.yml uses, and for the same reason:
      # the nixos/nix image carries no node, so actions/checkout cannot run.
      # Shallow, unlike ci.yml — nothing here reads history, and gitleaks (the
      # reason that one fetches everything) is not part of this job.
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --prune --depth=1 origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout -q --detach "$GITHUB_SHA"

      # `mdbook-mermaid install` writes mermaid.min.js and mermaid-init.js next
      # to book.toml, which book.toml references in `additional-js`. They are
      # gitignored — 2.6 MB of vendored minified JS whose version flake.lock
      # already pins — so this step is NOT optional: without it `mdbook build`
      # fails on the missing files rather than quietly shipping un-rendered
      # fences.
      - name: Build
        run: |
          nix develop .#ci -c mdbook-mermaid install docs
          nix develop .#ci -c mdbook build docs

      # The staging path is the contract with modules/pages-pull.nix: the
      # artifact's own root becomes <owner>/<repo>, so this directory name is
      # the `/docs/` in the published URL. Changing it changes the URL and
      # nothing warns you.
      - name: Stage
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp -r docs/book/. _site/docs/

      # upload-artifact is a JavaScript action and this job runs on the `nix`
      # label — nixos/nix carries no node, which is the same reason Checkout
      # above is a hand-written `git fetch`. Without this the step dies before
      # it starts:
      #
      #   crun: executable file `node` not found in $PATH
      #   [runner]: exitcode '127': command not found
      #
      # Take the dev shell's node rather than installing a second toolchain
      # into the container. It is already pinned by flake.lock, and $GITHUB_PATH
      # is the runner's own documented mechanism rather than an assumption about
      # where a particular image keeps its profile — an earlier version of this
      # file wrote into /root/.nix-profile because that is the first entry of
      # nixos/nix's PATH, which is true today and is not a contract.
      #
      # Verbatim from skavex's pages.yml, which is what that repo publishes
      # with.
      - name: Put the dev shell's node on PATH for the upload action
        run: |
          node_bin=$(nix develop .#ci -c bash -c 'command -v node')
          if [ -z "$node_bin" ]; then
            echo "no node in the dev shell — upload-artifact cannot run" >&2
            exit 1
          fi
          dirname "$node_bin" >> "$GITHUB_PATH"

      # forgejo/... AND NOT actions/..., which is not a mirror preference — it
      # is the only version of this action that can run here at all.
      # actions/upload-artifact@v4 bundles @actions/artifact v2, which tests
      # GITHUB_SERVER_URL's hostname, concludes a Forgejo instance is GitHub
      # Enterprise Server, and throws before opening a socket. The Forgejo fork
      # is one commit on top of the same release: isGhes() returns false.
      #
      # The bare owner/repo form resolves against DEFAULT_ACTIONS_URL, unset on
      # this instance and so Forgejo's own default of https://code.forgejo.org,
      # which is where the fork lives.
      #
      # The name `pages` is the contract with modules/pages-pull.nix: it
      # discovers every repo holding a live artifact with exactly this name and
      # ignores the rest. Uploading it is what makes this a pages repo — there
      # is no list on the VPS to add it to and no deploy to run.
      - name: Publish
        uses: forgejo/upload-artifact@v5
        with:
          name: pages
          path: _site/
          # An empty upload would otherwise be a green run that quietly leaves
          # the last good site in place forever.
          if-no-files-found: error
