# ==============================================================================
# pre-commit — the checks that run before a commit, and again in CI
# ==============================================================================
# One definition, three consumers: `pre-commit install` wires these to the local
# commit hook, and both CI workflows — .forgejo/workflows/ci.yml and
# .github/workflows/ci.yml — run the very same file with
# `pre-commit run --all-files`. A check cannot pass locally and fail in CI
# because of drift between lists, because there is only one list.
#
# The nix tools run through `nix develop .#ci`, NOT from bare $PATH. A bare
# `language: system` entry resolves whatever happens to be on the PATH of the
# process invoking git — which for an editor or lazygit is not the dev shell.
# That is not hypothetical: statix 0.5.8 from a mason install reports two W04
# warnings on this tree that the flake's statix does not, so the same commit
# passed in CI and failed in the editor. Going through the flake means one
# pinned version answers everywhere.
#
#   nix develop -c pre-commit install       # once, per clone
#   nix develop -c pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        # secrets.yaml is sops output: valid YAML, but the parser has no reason
        # to walk it and nothing here would act on the result.
        exclude: ^secrets\.yaml$
      - id: check-added-large-files
        # The UEFI variable stores are ~530K and legitimately tracked.
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt-rfc-style
        description: Every .nix file in this repo is formatted with nixfmt-rfc-style.
        entry: nix develop .#ci -c nixfmt --check
        language: system
        files: \.nix$

      - id: statix
        name: statix
        description: Lint for nix antipatterns.
        entry: nix develop .#ci -c statix check
        language: system
        files: \.nix$
        pass_filenames: false

      - id: tofu-fmt
        name: tofu fmt
        entry: nix develop .#ci -c tofu fmt -check -recursive tofu/
        language: system
        files: \.tf$
        pass_filenames: false

      # markdown. This is a LINTER ONLY — it reports missing code-fence
      # languages and over-long prose, and does not reformat anything.
      #
      # Formatting is prettier's, and prettier is deliberately NOT a hook here.
      # An editor runs it on save, so it wins every race regardless of what
      # this file says; the rules in .markdownlint-cli2.yaml are instead tuned
      # so that prettier's output passes untouched. Where the two genuinely
      # disagreed — MD004, because prettier alternates `-` and `*` between
      # adjacent lists on purpose — the rule is off, and says so.
      #
      # The other reason prettier is not here: nixpkgs-26.05 carries 3.8.3,
      # which MANGLES a paragraph containing both an intraword underscore and
      # an emphasis span. `a basic_auth thing and _through_ it` comes back as
      # `a basic*auth thing and \_through* it` — silent corruption of
      # ARCHITECTURE.md, found by running it. Fixed by 3.9.6, so this becomes
      # viable after a flake bump — re-run that one-liner through
      # `nix develop .#ci -c prettier` before trusting it.
      #
      # pass_filenames: false, like statix and tofu-fmt above: the file set is
      # already declared in .markdownlint-cli2.yaml, so `markdownlint-cli2`
      # typed by hand checks exactly what the hook checks, and a change to the
      # CONFIG re-checks every document rather than only the ones staged with
      # it. `files` still gates the hook, so it runs only when markdown is
      # staged.
      - id: markdownlint
        name: markdownlint-cli2
        entry: nix develop .#ci -c markdownlint-cli2
        language: system
        files: \.md$
        pass_filenames: false

      # gitleaks over a hand-rolled "is it still encrypted" grep: it scans the
      # staged diff against a maintained ruleset, so it catches a pasted token
      # anywhere in the tree rather than only a decrypted secrets.yaml.
      #
      # --staged, not a directory scan: `gitleaks dir` reads gitignored files
      # too, and tofu/terraform.tfvars legitimately holds live tokens. Scanning
      # it would fail the hook forever over a file git will never accept.
      # Full-history scanning belongs in CI, where it is a separate step.
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: nix develop .#ci -c gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
