# Default rules, plus one narrow exception.
[extend]
useDefault = true

# pkgs/openamika/assets.json maps upstream's model files to their published
# SHA-256. Files named tokenizer.json or special_tokens_map.json put "token"
# next to a 64-hex value, which generic-api-key reads as a key. Allowed only
# when the whole line is exactly `"<file>": "<sha256>"`: a real token is not
# 64 lowercase hex, so it is still caught (tested with a gitlab and a github
# token in that file). No `paths` entry: gitleaks 8.30 treats a path match
# alone as enough, which let both test tokens through.
[[allowlists]]
description = "SHA-256 hashes of public model files"
regexTarget = "line"
regexes = ['''^\s*"[^"]+": "[0-9a-f]{64}",?$''']
