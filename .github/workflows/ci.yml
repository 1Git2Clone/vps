# ==============================================================================
# CI
# ==============================================================================
# The MIRROR's copy. Its twin is .forgejo/workflows/ci.yml, and the split is
# not cosmetic: Forgejo reads .forgejo/workflows and falls back to
# .github/workflows only when that directory is absent. So this file runs on
# GitHub alone — but delete .forgejo/workflows and Forgejo picks THIS file up
# again, where `permissions:` below is ignored with a warning and a bare
# `uses: cachix/...` cannot resolve at all.
#
# Keep the two in step by intent rather than by copy-paste. They check the same
# things; they differ in job layout and in how actions are addressed, for
# reasons written down in the Forgejo one.
#
# Because the mirror is push-only, everything here must be committed on the
# Forgejo side and allowed to flow across. Editing these files on GitHub would
# be overwritten by the next mirror push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point linting a commit that is already
# two commits stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # gitleaks scans commits; a shallow clone would scan almost nothing.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The same file the local commit hook uses, so a green CI means a clean
      # `pre-commit run --all-files` on the developer's machine and vice versa.
      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # The pre-commit hook scans the STAGED diff, which is empty in CI, so the
      # history scan lives here instead. fetch-depth 0 above is what makes it a
      # real scan rather than a scan of one commit.
      - name: gitleaks (full history)
        run: nix develop .#ci -c gitleaks git --redact --no-banner .

  evaluate:
    name: Evaluate the NixOS configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluation only — deliberately not a build. This catches the failure
      # that actually happens in this repo (a module that does not evaluate:
      # a typo'd option, a missing argument, an infinite recursion) without
      # asking a CI runner to realise a multi-gigabyte system closure.
      - name: Evaluate vps-hetzner
        run: |
          nix eval --raw \
            .#nixosConfigurations.vps-hetzner.config.system.build.toplevel.drvPath

      - name: Evaluate vps (local VM variant)
        run: |
          nix eval --raw \
            .#nixosConfigurations.vps.config.system.build.toplevel.drvPath

      # --no-build, and the reason matters: deploy-rs contributes a
      # `deploy-activate` check that references the whole system closure, so a
      # plain `nix flake check` builds the entire NixOS system — and because
      # deploy-rs `follows` our nixpkgs, its binary is a cache miss and gets
      # compiled from source. That was 5+ minutes on every run, not just the
      # first: a GitHub runner starts with an empty nix store every time.
      #
      # This still evaluates every output, which is what catches a broken
      # module.
      - name: nix flake check (evaluate)
        run: nix flake check --no-build --print-build-logs

      # The half of deployChecks worth actually building: it validates deploy.json
      # against deploy-rs's schema — the config only otherwise exercised by
      # running a real deploy — and pulls in check-jsonschema alone, no Rust
      # toolchain and no system closure.
      - name: Validate the deploy schema
        run: nix build --print-build-logs .#checks.x86_64-linux.deploy-schema
