# NOTE: Put this in `~/.sops-nix/nixos-image-secrets.yaml`.

# === Main ===
root_password: ...
user_password: ...

# === Backups ===
backups:
  restic_repository: "b2:example:infra"
  restic_password: "..."
  b2_account_id: "..."
  b2_account_key: "..."
  healthcheck_url: https://hc-ping.com/<your-uuid>

# === Certs ===
acme_email: "user@acme.com"
cloudflare:
  api_token: "cfut_CHANGEME"
  # === Cloudflared ===
  tunnel_token: "eyJ..."

# === Dozzle ===
dozzle:
  admin_user: "user@acme.com"
  admin_password_hash: "$2a$..."

# === Emails ===
email:
  postmaster: "postmaster@acme.com"
  dkim_private_key: |
    -----BEGIN PRIVATE KEY-----
    CHANGEME
    -----END PRIVATE KEY-----

# === Certbot domains (single cert, lineage name pinned to certbot_cert_name) ===
certbot_domains:
  - acme.com
  - subdomain-1.acme.com
  - subdomain-2.acme.com
  - subdomain-3.acme.com
  - subdomain-4.acme.com

# === Bootstrap ===
tailscale_authkey: "tskey-auth-CHANGEME"
