# NOTE: Put this in `~/.sops-nix/nixos-image-secrets.yaml`.
#
# Every key below is declared in modules/secrets.nix. A declared key that is
# missing here fails sops-install-secrets during activation, which on a fresh
# install means the machine boots with no credentials at all — so add the key
# and the secret in the same change.

# === Main ===
root_password: ...
user_password: ...

# === Backups ===
backups:
  restic_repository: "b2:example:infra"
  # The repository password IS the encryption key. Lose it and every snapshot
  # is permanently unreadable, so keep a copy outside this file too.
  restic_password: "..."
  b2_account_id: "..."
  b2_account_key: "..."
  healthcheck_url: https://hc-ping.com/<your-uuid>

# === Cloudflare ===
cloudflare:
  # Zone:Read + DNS:Edit. Used by lego for the ACME DNS-01 challenge, and it is
  # the same token as cloudflare_api_token in tofu/terraform.tfvars.
  api_token: "cfut_CHANGEME"
  # === Cloudflared ===
  tunnel_token: "eyJ..."

# === Dozzle ===
dozzle:
  # Dozzle cannot hash a plaintext password. Generate the bcrypt hash once:
  #   docker run -it --rm amir20/dozzle:v10.7.1 generate <user> \
  #     --password '<password>' --email you@example.com --name '<name>'
  # and paste the `password:` value below.
  admin_user: "hutao"
  admin_password_hash: "$2a$..."

# === Forgejo ===
forgejo:
  # ONE RUNNER PER LINE, as `<uuid> <secret>`, with an optional trailing
  # `# comment` naming it. Consumers look up their own line BY UUID, so adding
  # or reordering lines cannot point a runner at another runner's credential.
  #
  # Forgejo runners are DECLARED, not registered: `forgejo-runner register`
  # reports itself as deprecated in 13.1.0, so identity is the uuid+secret PAIR
  # rather than a one-shot registration token. Site Administration -> Actions ->
  # Runners -> Create new runner creates the record and shows both. The uuid is
  # an identifier and appears in plaintext in the module that uses it; only the
  # secret belongs here. Deleting the record invalidates both halves at once.
  #
  # The separate CI box does NOT read this file — it holds no age key, and
  # giving it one would hand a machine we do not trust the key to mail, backups
  # and everything else here. Its pair arrives in Hetzner user-data at create
  # time, which is what lets N identical clones each come up as themselves. A
  # line here for such a host is operator inventory and is read by nothing.
  runners: |
    602bb6f5-388b-4409-a3a9-5c56c950c408 a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0 # on-prem container
    187cde37-2e9b-4601-b431-b437e7f83bc4 0f9e8d7c6b5a40392817263544332211aabbccdd # ci box 1

  # SYSTEM WEBHOOKS, keyed by hook name. One entry per hook created in
  # Site Administration -> Integrations -> Webhooks, which fire for EVERY
  # repository on the instance rather than for one.
  #
  # `pages_pull` is the HMAC secret modules/pages-hook.nix verifies on each
  # delivery, read from the X-Hub-Signature-256 header. Generate one and paste
  # the SAME string into the hook's `Secret` field:
  #
  #   head -c 32 /dev/urandom | base64
  #
  # Nothing can check the two match. A mismatch is a 403 in
  # `journalctl -u pages-hook` and a failed delivery in the hook's own history.
  system_webhooks:
    pages_pull:
      secret: "..."

# === Renovate ===
# Both of these were Forgejo Actions SECRETS until the CI runner moved onto its
# own untrusted box. They are here now because a runner we do not trust does not
# get a long-lived cross-org write credential handed to it once a day — the job
# became modules/renovate.nix, a timer on this host. See that file's header.
#
# Note you cannot migrate these by copying: a Forgejo Actions secret is
# write-only once set, so both had to be reissued rather than read back.
renovate:
  # As the `renovate` BOT ACCOUNT, not a personal account — Renovate takes its
  # git author from whoever the token belongs to, so a personal token makes
  # every update commit indistinguishable from a hand-written one in git log,
  # in blame, and in the PR list.
  #
  # /user/settings/applications -> Generate New Token, with write on
  # `repository` and `issue`, read on `user` and `organization`. `issue` is the
  # one that gets forgotten: the dependency dashboard IS an issue, and without
  # that scope the run silently produces no dashboard.
  token: "..."

  # NOT the Forgejo token, and not optional in practice. Renovate reads
  # github.com for release notes and for the versions of anything sourced
  # there. Anonymous github.com allows 60 requests per hour per IP, so without
  # this, actions/checkout, cachix/install-nix-action and hashicorp/terraform
  # are rate-limited into silence — they do not error, they just stop producing
  # updates, which is the failure you never notice.
  #
  # A classic PAT with NO scopes ticked is correct and sufficient: it only
  # needs to raise the read limit on public data.
  github_com_token: "ghp_..."

# === Grafana ===
# Anonymous Admin access is off, so without these there is no way in.
grafana:
  admin_user: "hutao"
  admin_password: "CHANGEME"

# === Vuln Scan ===
vuln_scan:
  # Discord webhook URL for daily vulnerability digest.
  # Create one at: Server Settings > Integrations > Webhooks > New Webhook
  discord_webhook_url: "https://discord.com/api/webhooks/..."

# === Kuma ===
kuma:
  # Probes status.<domain> every five minutes and pings this on success, so
  # silence is the alert — including when the whole host is down, which is the
  # one outage a self-hosted status page cannot report itself. A separate check
  # from the backup one: they fail for different reasons.
  healthcheck_url: https://hc-ping.com/<your-uuid>

# === Minecraft ===
minecraft:
  # RCON is published on loopback only, but it is a remote console.
  rcon_password: "CHANGEME"

# The second world. Its own password: 127.0.0.1:25576 is a different console
# from 25575 and is meant to stay that way.
minecraft2:
  rcon_password: "CHANGEME"

# === Emails ===
email:
  postmaster: "postmaster@acme.com"
  # The PRIVATE half of the `default` DKIM selector. Its public half is
  # published from tofu as dkim_default_key — the two must be halves of the same
  # key or mail fails DKIM at every recipient. Cannot be regenerated without
  # republishing DNS.
  # Roundcube encrypts the logged-in user's password into its session with this.
  # If it is unset the container GENERATES A RANDOM ONE on every start, so every
  # deploy silently invalidates existing sessions: roundcube then has no password
  # to authenticate with, sending fails with "554 5.7.1 Client host rejected:
  # Access denied", and receiving keeps working so it looks like anything else.
  # Any 24 random characters. Rotating it logs every session out everywhere,
  # which is what you want if the session store ever leaks.
  #   head -c 18 /dev/urandom | base64 | tr -d '/+=' | head -c 24
  roundcube_des_key: "CHANGEME-24-random-chars"
  dkim_private_key: |
    -----BEGIN PRIVATE KEY-----
    CHANGEME
    -----END PRIVATE KEY-----

# === Bootstrap ===
# An OAUTH CLIENT SECRET, not a `tskey-auth-` key. Tailscale accepts one in
# place of an auth key, and it does not expire — the auth keys this replaces
# capped out at 90 days, leaving the box one forgotten rotation away from being
# unable to rejoin its own tailnet after a rebuild.
#
# Create it at Settings -> Trust credentials -> Credential -> OAuth:
#   scope  Keys -> Auth Keys -> Write   (and nothing else)
#   tags   tag:vps                      (the client can only mint keys for the
#                                        tags selected here)
#
# PASTE THE SECRET BARE. The `?ephemeral=false&preauthorized=true` that has to
# accompany it is added by sops.templates."tailscale-authkey" in
# modules/services.nix, deliberately in the clear — ephemeral defaults to TRUE
# for an OAuth-minted key, and an ephemeral node deletes itself from the tailnet
# when it goes offline. That belongs somewhere reviewable, not in ciphertext.
tailscale_oauth_client_secret: "tskey-client-CHANGEME"

# === Serenity Discord Bot ===
serenity:
  bot_token: "MTI..."
  ai_api_key: "sk-or-v1-..."
  db_password: "super-secret-special-string"

# === Searxng ===
searxng:
  secret_key: "<openssl rand -hex 32>"
  admin_user: "hutao"
  admin_password_hash: "$2b$14$REPLACE_ME" # mkpasswd -m bcrypt -R 14

# === Navidrome ===
navidrome:
  # One application registration at https://www.last.fm/api/account/create
  # gives both. Callback URL is not used by navidrome's flow; any value is
  # accepted at registration.
  #
  # These enable scrobbling for the SERVER. Each user still has to link their
  # own Last.fm account in Personal Settings -> "Scrobble to Last.fm"; nothing
  # is scrobbled until they do.
  lastfm:
    api_key: "CHANGEME"
    secret: "CHANGEME"
