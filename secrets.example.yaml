# NOTE: Put this in `~/.sops-nix/nixos-image-secrets.yaml`.
#
# Every key below is declared in modules/secrets.nix. A declared key that is
# missing here fails sops-install-secrets during activation, which on a fresh
# install means the machine boots with no credentials at all — so add the key
# and the secret in the same change.

# === Main ===
root_password: ...
user_password: ...

# === Backups ===
backups:
  restic_repository: "b2:example:infra"
  # The repository password IS the encryption key. Lose it and every snapshot
  # is permanently unreadable, so keep a copy outside this file too.
  restic_password: "..."
  b2_account_id: "..."
  b2_account_key: "..."
  healthcheck_url: https://hc-ping.com/<your-uuid>

# === Cloudflare ===
cloudflare:
  # Zone:Read + DNS:Edit. Used by lego for the ACME DNS-01 challenge, and it is
  # the same token as cloudflare_api_token in tofu/terraform.tfvars.
  api_token: "cfut_CHANGEME"
  # === Cloudflared ===
  tunnel_token: "eyJ..."

# === Dozzle ===
dozzle:
  # Dozzle cannot hash a plaintext password. Generate the bcrypt hash once:
  #   docker run -it --rm amir20/dozzle:v10.7.1 generate <user> \
  #     --password '<password>' --email you@example.com --name '<name>'
  # and paste the `password:` value below.
  admin_user: "hutao"
  admin_password_hash: "$2a$..."

# === Forgejo ===
forgejo:
  # The Actions runner's own secret. Site Administration -> Actions -> Runners
  # -> Create new runner creates the record and shows a uuid and a secret; the
  # uuid goes in modules/containers/forgejo-runner.nix, the secret goes here.
  # Not the "Show registration token" value — that drives the legacy
  # `forgejo-runner register` path this config does not use.
  runner_token: "..."

# === Grafana ===
# Anonymous Admin access is off, so without these there is no way in.
grafana:
  admin_user: "hutao"
  admin_password: "CHANGEME"

# === Vuln Scan ===
vuln_scan:
  # Discord webhook URL for daily vulnerability digest.
  # Create one at: Server Settings > Integrations > Webhooks > New Webhook
  discord_webhook_url: "https://discord.com/api/webhooks/..."

# === Kuma ===
kuma:
  # Probes status.<domain> every five minutes and pings this on success, so
  # silence is the alert — including when the whole host is down, which is the
  # one outage a self-hosted status page cannot report itself. A separate check
  # from the backup one: they fail for different reasons.
  healthcheck_url: https://hc-ping.com/<your-uuid>

# === Minecraft ===
minecraft:
  # RCON is published on loopback only, but it is a remote console.
  rcon_password: "CHANGEME"

# === Emails ===
email:
  postmaster: "postmaster@acme.com"
  # The PRIVATE half of the `default` DKIM selector. Its public half is
  # published from tofu as dkim_default_key — the two must be halves of the same
  # key or mail fails DKIM at every recipient. Cannot be regenerated without
  # republishing DNS.
  # Roundcube encrypts the logged-in user's password into its session with this.
  # If it is unset the container GENERATES A RANDOM ONE on every start, so every
  # deploy silently invalidates existing sessions: roundcube then has no password
  # to authenticate with, sending fails with "554 5.7.1 Client host rejected:
  # Access denied", and receiving keeps working so it looks like anything else.
  # Any 24 random characters. Rotating it logs every session out everywhere,
  # which is what you want if the session store ever leaks.
  #   head -c 18 /dev/urandom | base64 | tr -d '/+=' | head -c 24
  roundcube_des_key: "CHANGEME-24-random-chars"
  dkim_private_key: |
    -----BEGIN PRIVATE KEY-----
    CHANGEME
    -----END PRIVATE KEY-----

# === Bootstrap ===
# Pre-authorized and reusable, NOT ephemeral — the node persists across reboots.
# Without it `tailscale up` blocks on a login URL and the install is not
# unattended.
tailscale_authkey: "tskey-auth-CHANGEME"

# === Serenity Discord Bot ===
serenity:
  bot_token: "MTI..."
  ai_api_key: "sk-or-v1-..."
  db_password: "super-secret-special-string"

# === Searxng ===
searxng:
  secret_key: "<openssl rand -hex 32>"
  admin_user: "hutao"
  admin_password_hash: "$2b$14$REPLACE_ME" # mkpasswd -m bcrypt -R 14

# === Navidrome ===
navidrome:
  # One application registration at https://www.last.fm/api/account/create
  # gives both. Callback URL is not used by navidrome's flow; any value is
  # accepted at registration.
  #
  # These enable scrobbling for the SERVER. Each user still has to link their
  # own Last.fm account in Personal Settings -> "Scrobble to Last.fm"; nothing
  # is scrobbled until they do.
  lastfm:
    api_key: "CHANGEME"
    secret: "CHANGEME"
